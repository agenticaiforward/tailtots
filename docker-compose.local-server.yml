services:
  tailtots-db:
    image: postgres:16-alpine
    container_name: tailtots-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tailtots
      POSTGRES_USER: tailtots_app
      POSTGRES_PASSWORD: tailtots_local_change_me
    ports:
      - "15432:5432"
    volumes:
      - tailtots-db-data:/var/lib/postgresql/data
      - ./supabase/local-init:/docker-entrypoint-initdb.d:ro
      - ./supabase/schema.sql:/tailtots-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailtots_app -d tailtots"]
      interval: 10s
      timeout: 5s
      retries: 10

  tailtots-rest:
    image: postgrest/postgrest:v12.2.8
    container_name: tailtots-rest
    restart: unless-stopped
    depends_on:
      tailtots-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://tailtots_app:tailtots_local_change_me@tailtots-db:5432/tailtots
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: tailtots_app
      PGRST_SERVER_PORT: 3000
      PGRST_JWT_SECRET: tailtots_local_dev_jwt_secret_change_me_32_chars
    ports:
      - "18000:3000"

  tailtots-admin:
    image: adminer:4.8.1
    container_name: tailtots-admin
    restart: unless-stopped
    depends_on:
      tailtots-db:
        condition: service_healthy
    ports:
      - "18080:8080"

volumes:
  tailtots-db-data:
